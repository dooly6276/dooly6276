name: profile card

on:
  schedule:
    # 매시간. 정시는 GitHub 예약이 몰려 몇 시간씩 밀려서 23분에 돈다
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: generate activity card
        run: node .github/scripts/activity.mjs ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 비공개 저장소까지 읽는 토큰. 없으면 .github/data/languages.json 을 쓴다
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 공개 저장소는 60일 동안 활동이 없으면 예약 실행이 꺼진다. 다시 켜기를 불러 그 기한을 늘린다
      - name: keep the schedule alive
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/profile-card.yml/enable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
